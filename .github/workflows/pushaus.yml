name: Pushing to repo
on: workflow_dispatch
permissions: 
  contents: write

jobs:
  repo-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create new repo file
        run: |
          touch info.txt
          echo "Reima Riihimäki" > info.txt
          git config --global user.name 'repenaattori'
          git config --global user.email 'reimarii@oamk.fi'
          git add .
          git commit -m 'Created info file'
          git push
          
